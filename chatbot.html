<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSU Library Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar with quick links -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/rangsit-logo.png" alt="Rangsit University Logo" class="sidebar-logo">
                <h3 data-i18n="chatbot.sidebar.quickLinks">Quick Links</h3>
            </div>
            <div class="quick-links">
                <button class="quick-link-btn" data-question="What are the library hours?">
                    <i class="fas fa-clock"></i> <span data-i18n="chatbot.sidebar.hours">Library Hours</span>
                </button>
                <button class="quick-link-btn" data-question="How do I borrow books?">
                    <i class="fas fa-book"></i> <span data-i18n="chatbot.sidebar.borrowing">Borrowing Books</span>
                </button>
                <button class="quick-link-btn" data-question="Where can I find study rooms?">
                    <i class="fas fa-door-open"></i> <span data-i18n="chatbot.sidebar.studyRooms">Study Rooms</span>
                </button>
                <button class="quick-link-btn" data-question="How do I access online resources?">
                    <i class="fas fa-laptop"></i> <span data-i18n="chatbot.sidebar.onlineResources">Online Resources</span>
                </button>
            </div>
            <div class="back-button-container">
                <a href="index.html" class="back-button">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="chatbot.sidebar.backToLibrary">Back to Library</span>
                </a>
            </div>
        </aside>

        <!-- Main chat interface -->
        <main class="chat-container">
            <header class="chat-header">
                <div class="header-content">
                    <h1 data-i18n="chatbot.header.title">Library Assistant</h1>
                    <p class="status">
                        <span class="status-indicator"></span>
                        <span class="status-text" data-i18n="chatbot.header.connecting">Connecting...</span>
                    </p>
                </div>
                <div class="header-actions">
                    <button id="clear-chat" class="icon-button" title="Clear chat" aria-label="Clear chat">
                        <i class="fas fa-broom"></i>
                    </button>
                    <button id="toggle-theme" class="icon-button" title="Toggle theme" aria-label="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="language-switch">
                        <button type="button" data-lang="en" class="active">EN</button>
                        <span>/</span>
                        <button type="button" data-lang="th">TH</button>
                    </div>
                </div>
            </header>

            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message">
                    <h2 data-i18n="chatbot.welcome.title">Welcome to RSU Library</h2>
                    <p data-i18n="chatbot.welcome.intro">Hi! I can help you with:</p>
                    <ul>
                        <li data-i18n="chatbot.welcome.i1">Finding books and resources</li>
                        <li data-i18n="chatbot.welcome.i2">Booking study rooms</li>
                        <li data-i18n="chatbot.welcome.i3">Printing and computer services</li>
                        <li data-i18n="chatbot.welcome.i4">Library hours and locations</li>
                    </ul>
                    <p data-i18n="chatbot.welcome.prompt">What can I help you with?</p>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="input-wrapper">
                    <textarea
                        id="user-input"
                        placeholder="Type your message here..."
                        data-i18n="chatbot.input.placeholder"
                        data-i18n-attr="placeholder"
                        rows="1"
                        aria-label="Message input"
                    ></textarea>
                    <button id="send-message" class="send-button" aria-label="Send message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="typing-indicator" style="display: none;">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/theme.js" type="module"></script>
    <script src="js/i18n.js" type="module"></script>
    <script src="js/chatbot.js" type="module"></script>
</body>
</html>
